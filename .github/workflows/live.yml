name: IPTV Live Source Search

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests urllib3

      - name: Run live.py
        run: |
          python watchtv/live.py

      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add watchtv/live.m3u8 watchtv/live.txt

          if git diff --cached --quiet; then
            echo "没有新的文件变化，不提交"
          else
            git commit -m "Update IPTV live sources"
            git push
          fi
